group = 'com.evento'
version = '2.5.2'

allprojects {
    ext {
        javaLanguageVersion = JavaLanguageVersion.of(25)
        eventoVersion = '2.5.2'
        jacksonVersion = '2.22.2'
        nettyVersion = '4.2.17.Final'
        lz4Version = '1.8.0'
        micrometerVersion = '1.13.6'
        junitVersion = '5.11.4'
        assertjVersion = '3.27.7'
        lombokVersion = '1.18.48'
        flywayVersion = '13.4.0'
        testcontainersVersion = '1.21.3'
        postgresJdbcVersion = '42.7.13'
        mysqlJdbcVersion = '26.7.0'
        hikariVersion = '7.1.0'
        jazzerVersion = '0.30.0'
        openTelemetryVersion = '1.66.0'
    }
}

subprojects {
    apply plugin: 'java'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

// The libraries applications link against run on Java 21+: built with JDK 25 but compiled with
// --release 21, so neither the language level nor the JDK API can drift past 21. The server
// ships as an image and stays on 25. Keep this list in sync with section 1 of LICENSE.txt.
// `-PtestJdk=21` runs their tests on that JDK (CI checks the baseline that way).
ext.clientLibraries = [
        ':evento-transport-api',
        ':evento-transport-netty',
        ':evento-common',
        ':evento-bundle',
        ':evento-consumer-state-store:evento-consumer-state-store-jdbc',
        ':evento-test',
        ':evento-spring-boot-starter',
        ':evento-opentelemetry',
]
ext.clientJavaRelease = 21

configure(subprojects.findAll { it.path in clientLibraries }) {
    tasks.withType(JavaCompile).configureEach {
        options.release = clientJavaRelease
    }
    // Not the starter: its end-to-end test runs a real broker, and the server needs JDK 25.
    if (project.hasProperty('testJdk') && project.path != ':evento-spring-boot-starter') {
        tasks.withType(Test).configureEach {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(project.property('testJdk') as int)
            }
        }
    }
}