group = 'com.evento'
version = '3.0.1'

allprojects {
    ext {
        javaLanguageVersion = JavaLanguageVersion.of(25)
        eventoVersion = '3.0.1'
        jacksonVersion = '2.22.4'
        nettyVersion = '4.2.19.Final'
        lz4Version = '1.12.1'
        micrometerVersion = '1.13.6'
        junitVersion = '5.11.4'
        assertjVersion = '3.27.7'
        lombokVersion = '1.18.48'
        flywayVersion = '13.11.1'
        testcontainersVersion = '1.21.4'
        postgresJdbcVersion = '42.7.14'
        mysqlJdbcVersion = '26.10.0'
        hikariVersion = '7.1.0'
        jazzerVersion = '0.30.0'
        openTelemetryVersion = '1.67.0'
    }
}

subprojects {
    apply plugin: 'java'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

// The libraries applications link against (Apache-2.0). Keep this list in sync with section 1 of
// LICENSE.txt. Since 3.0 they need Java 25 like the server: ClassGraph 6, which the bundle scans
// components with, ships Java 25 class files. `clientJavaRelease` pins their bytecode level, and
// `-PtestJdk=N` runs their tests on another JDK if the baseline is ever lowered again.
ext.clientLibraries = [
        ':evento-transport-api',
        ':evento-transport-netty',
        ':evento-common',
        ':evento-bundle',
        ':evento-consumer-state-store:evento-consumer-state-store-jdbc',
        ':evento-test',
        ':evento-spring-boot-starter',
        ':evento-opentelemetry',
]
ext.clientJavaRelease = 25

configure(subprojects.findAll { it.path in clientLibraries }) {
    tasks.withType(JavaCompile).configureEach {
        options.release = clientJavaRelease
    }
    // Not the starter: its end-to-end test runs a real broker, and the server needs JDK 25.
    if (project.hasProperty('testJdk') && project.path != ':evento-spring-boot-starter') {
        tasks.withType(Test).configureEach {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(project.property('testJdk') as int)
            }
        }
    }
}