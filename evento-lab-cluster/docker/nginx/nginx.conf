# evento-lab-cluster load balancer (service 'lb').
#
# http   :8080  location-aware ingress. Routes on the X-Region header (or ?region=) to the
#               gateway gateway-<r>:8080 (bundle order-gateway); same-cell regions are 'backup' servers, so a
#               dead gateway fails over inside its cell, never across the WAN. No header or an
#               unknown region -> EUROPA. Every response carries X-Lab-Region (the routing key)
#               and X-Lab-Upstream (the gateway that actually served it).
# stream :3030  one bus VIP per cell, bound to the lb's static address on that cell network
#               (bus-eu 172.28.1.10, bus-am 172.28.2.10, bus-apac 172.28.3.10). Primary = the
#               cell's own evento-server; backups = the other two servers, reached through
#               toxiproxy so a failover pays the WAN RTT. Emulates DNS/VIP failover (G2).
#
# All upstream servers use 'resolve' (nginx >= 1.27.3) against Docker's DNS: the lb starts
# even when the upstream containers do not exist yet, and follows restarts/IP changes. A
# killed container stops resolving, so its server drops out and the backups take over.

worker_processes 1;
error_log /dev/stderr notice;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;

    log_format lab '$time_iso8601 $remote_addr "$request" region=$region_key '
                   'status=$status up=$upstream_addr up_status=$upstream_status '
                   'rt=$request_time urt=$upstream_response_time idem="$http_x_idempotency_key"';
    access_log /dev/stdout lab;

    # X-Region wins; ?region= is the fallback for clients that cannot set headers.
    map $http_x_region $region_raw {
        ""      $arg_region;
        default $http_x_region;
    }
    map $region_raw $region_key {
        ~*^europa$               europa;
        ~*^africa$               africa;
        ~*^america$              america;
        ~*^sud[_-]?america$      sud_america;
        ~*^cina$                 cina;
        ~*^india$                india;
        ~*^australia[_-]?nz$     australia_nz;
        default                  europa;
    }

    # --- cell EU -------------------------------------------------------------------------
    upstream gateway_europa {
        zone gateway_europa 64k;
        server gateway-europa:8080 resolve max_fails=1 fail_timeout=5s;
        server gateway-africa:8080 resolve backup;
    }
    upstream gateway_africa {
        zone gateway_africa 64k;
        server gateway-africa:8080 resolve max_fails=1 fail_timeout=5s;
        server gateway-europa:8080 resolve backup;
    }
    # --- cell AM -------------------------------------------------------------------------
    upstream gateway_america {
        zone gateway_america 64k;
        server gateway-america:8080 resolve max_fails=1 fail_timeout=5s;
        server gateway-sud-america:8080 resolve backup;
    }
    upstream gateway_sud_america {
        zone gateway_sud_america 64k;
        server gateway-sud-america:8080 resolve max_fails=1 fail_timeout=5s;
        server gateway-america:8080 resolve backup;
    }
    # --- cell APAC -----------------------------------------------------------------------
    upstream gateway_cina {
        zone gateway_cina 64k;
        server gateway-cina:8080 resolve max_fails=1 fail_timeout=5s;
        server gateway-india:8080 resolve backup;
        server gateway-australia-nz:8080 resolve backup;
    }
    upstream gateway_india {
        zone gateway_india 64k;
        server gateway-india:8080 resolve max_fails=1 fail_timeout=5s;
        server gateway-cina:8080 resolve backup;
        server gateway-australia-nz:8080 resolve backup;
    }
    upstream gateway_australia_nz {
        zone gateway_australia_nz 64k;
        server gateway-australia-nz:8080 resolve max_fails=1 fail_timeout=5s;
        server gateway-cina:8080 resolve backup;
        server gateway-india:8080 resolve backup;
    }

    server {
        listen 8080;

        location = /lb/health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            # Variable proxy_pass resolves to the upstream{} group of the same name.
            proxy_pass http://gateway_$region_key;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Lab-Region $region_key;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_send_timeout 65s;
            proxy_read_timeout 65s;   # > the 30 s default bus request timeout
            # Only retry on the backup when the request could not have reached a gateway
            # (connect error/timeout, 502/503/504). POSTs are never replayed once sent, so the
            # LB itself never manufactures duplicate commands (that is S14's job, explicitly).
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            add_header X-Lab-Region $region_key always;
            add_header X-Lab-Upstream $upstream_addr always;
        }
    }
}

stream {
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;

    log_format bus '$time_iso8601 $remote_addr vip=$server_addr up=$upstream_addr '
                   'status=$status session=$session_time up_connect=$upstream_connect_time';
    access_log /dev/stdout bus;

    # bus-eu: EU JVMs. Backups via toxi-eu (eu -> am 20123, eu -> apac 20133).
    upstream bus_eu {
        zone bus_eu 64k;
        server evento-eu:3030 resolve max_fails=1 fail_timeout=10s;
        server toxi-eu:20123 resolve backup;
        server toxi-eu:20133 resolve backup;
    }
    # bus-am: AM JVMs. Backups via toxi-am (am -> eu 20213, am -> apac 20233).
    upstream bus_am {
        zone bus_am 64k;
        server evento-am:3030 resolve max_fails=1 fail_timeout=10s;
        server toxi-am:20213 resolve backup;
        server toxi-am:20233 resolve backup;
    }
    # bus-apac: APAC JVMs. Backups via toxi-apac (apac -> eu 20313, apac -> am 20323).
    upstream bus_apac {
        zone bus_apac 64k;
        server evento-apac:3030 resolve max_fails=1 fail_timeout=10s;
        server toxi-apac:20313 resolve backup;
        server toxi-apac:20323 resolve backup;
    }

    server {
        listen 172.28.1.10:3030;
        proxy_pass bus_eu;
        proxy_connect_timeout 2s;
        proxy_timeout 1h;
    }
    server {
        listen 172.28.2.10:3030;
        proxy_pass bus_am;
        proxy_connect_timeout 2s;
        proxy_timeout 1h;
    }
    server {
        listen 172.28.3.10:3030;
        proxy_pass bus_apac;
        proxy_connect_timeout 2s;
        proxy_timeout 1h;
    }
}
