# evento-lab-cluster: multi-region Evento chaos lab.
# Design inputs: .claude/CLUSTER-READINESS.md (topology section, gaps G*, scenarios S*).
#
#   cells     EU   = EUROPA, AFRICA                  -> evento-eu,   es-pg-eu (ES primary),   app-pg-eu   (+ app-pg-eu-r)
#             AM   = AMERICA, SUD_AMERICA            -> evento-am,   es-pg-am (ES sync),      app-pg-am   (+ app-pg-am-r)
#             APAC = CINA, INDIA, AUSTRALIA_NZ       -> evento-apac, es-pg-apac (ES async),   app-pg-apac (+ app-pg-apac-r)
#
# Bundles: one image per bundle (order-command, order-query, order-saga, order-observer,
# order-gateway), one service per DEPLOYMENT. Every deployment of a bundle runs the same image;
# only the environment differs (EVENTO_CONTEXTS, EVENTO_ZONE, databases, addresses). See the
# README for the deployment table and the environment contract (BundleDeployment).
#
# Data: the event store is one replicated Postgres cluster (es-pg-*, db 'evento', plus db
# 'consumers' for the consumer state of the global ALL lane). App data is REGIONAL: three
# independent primaries, one per cell, each with a local streaming read replica; a cell's
# read models and its consumers' state live in its own database.
#
# Networking: one bridge per cell (net-eu, net-am, net-apac). A container sees only its own
# cell; everything cross-cell goes through toxiproxy, which sits on every cell network under
# the alias toxi-<cell>. Proxy '<src>-to-<svc>-<dst>' listens on 20000 + src*100 + dst*10 + svc
# (cells eu=1 am=2 apac=3; svc es-pg=1 app-pg=2 evento bus=3), e.g. am -> es-pg-eu = toxi-am:20211.
# Partitioning a cell = 'docker network disconnect net-<cell> toxiproxy' (+ 'lb' to also cut
# its bus VIP backups and HTTP ingress). 'wan' is the backbone the proxy and the lb share.
#
# Use scripts/up.sh / scripts/down.sh; plain 'docker compose -f docker/compose.yaml up -d'
# also works. Knobs (env): LAB_TAG, BUS_VIA_LB (via up.sh) or BUS_ADDR_EU/AM/APAC,
# CONSUMER_CHECKPOINT_MODE, PICK_STRATEGY, LAB_JAVA_OPTS. Profiles: 'replica' adds
# order-command-eu-b (S2), 'regional-observers' adds one observer per cell.

name: evento-lab-cluster

# ------------------------------------------------------------------------------------------
# Shared fragments
# ------------------------------------------------------------------------------------------
x-java-opts: &java-opts "${LAB_JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k}"

x-pg-command: &pg-command
  - postgres
  - -c
  - listen_addresses=*
  - -c
  - max_connections=200
  - -c
  - shared_buffers=32MB
  - -c
  - work_mem=2MB
  - -c
  - maintenance_work_mem=32MB
  - -c
  - wal_level=replica
  - -c
  - max_wal_senders=10
  - -c
  - wal_keep_size=512MB
  - -c
  - hot_standby=on
  - -c
  - hot_standby_feedback=on
  - -c
  - synchronous_commit=on
  - -c
  - wal_sender_timeout=30s
  - -c
  - wal_receiver_timeout=30s
  # G25: detect dead peers fast so orphaned advisory locks are released.
  - -c
  - tcp_keepalives_idle=10
  - -c
  - tcp_keepalives_interval=5
  - -c
  - tcp_keepalives_count=3
  - -c
  - client_connection_check_interval=5s

x-pg-healthcheck: &pg-healthcheck
  test: ["CMD", "sh", "/pg/healthcheck.sh"]
  interval: 3s
  timeout: 5s
  retries: 40
  start_period: 20s

x-pg-primary: &pg-primary
  image: postgres:17-alpine
  command: *pg-command
  healthcheck: *pg-healthcheck
  stop_grace_period: 5s
  shm_size: 128m

x-pg-replica: &pg-replica
  image: postgres:17-alpine
  entrypoint: ["sh", "/pg/replica-entrypoint.sh"]
  command: *pg-command
  healthcheck: *pg-healthcheck
  stop_grace_period: 5s
  shm_size: 128m

x-server: &server
  image: evento-lab-cluster/server:${LAB_TAG:-dev}
  mem_limit: 512m
  stop_grace_period: 10s
  healthcheck:
    test: ["CMD", "/app/healthcheck.sh", "3000", "/actuator/health/readiness"]
    interval: 5s
    timeout: 6s
    retries: 60
    start_period: 240s

x-server-env: &server-env
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: secret
  # Application pool for the work (story fetch, append, catalog). Held locks never take from it:
  # each server also opens a dedicated lock pool (EVENTO_LOCK_POOL_MAXIMUM_SIZE; the framework
  # default is 10, pinned to 16 here so runs stay comparable with the archived results). Budget
  # on the shared ES primary, which all three servers use (targetServerType=primary):
  # 3 x (20 + 16) = 108 plus the consumer-state pools, under max_connections=200 above.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "20"
  EVENTO_LOCK_POOL_MAXIMUM_SIZE: "16"
  EVENTO_CLUSTER_NAME: evento-lab-cluster
  EVENTO_ES_MODE: CPES
  # G12: prefer handlers in the caller's zone (EVENTO_ZONE of the bundles). A server without
  # the locality fix ignores the property; islands (G1) keep requests in-cell anyway.
  EVENTO_SERVER_BUS_PICK_STRATEGY: ${PICK_STRATEGY:-locality-preferred}
  # One DEBUG line per executed aggregate command with its phase timings (event=command_phases,
  # docs/command-latency.md). EVENTO_PHASE_LOG_LEVEL=DEBUG for a latency run; INFO otherwise.
  LOGGING_LEVEL_COM_EVENTO_SERVER_ES_PHASES: ${EVENTO_PHASE_LOG_LEVEL:-INFO}
  JAVA_OPTS: *java-opts

# Every bundle runs the Spring web server on 8080 and /actuator/health stays DOWN until its
# bundle completed the handshake, so one probe gates every deployment ('up --wait' then means
# "every bundle registered"). restart: on-failure because a JVM exits (code 3/4) after
# repeated start failures rather than retrying in-process (a failed EventoBundle start leaves
# its supervisor running).
x-bundle: &bundle
  stop_grace_period: 10s
  restart: on-failure
  healthcheck:
    test: ["CMD", "/app/healthcheck.sh", "8080", "/actuator/health"]
    interval: 5s
    timeout: 6s
    retries: 60
    start_period: 240s

# Environment every deployment shares.
x-env-common: &env-common
  EVENTO_CLUSTER_NAME: evento-lab-cluster
  EVENTO_CHECKPOINT_MODE: ${CONSUMER_CHECKPOINT_MODE:-DEFAULT}
  APP_DB_USER: postgres
  APP_DB_PASSWORD: secret
  # Optional: seconds the own server must be healthy before a failed-over bundle moves back
  # (N16). Empty = the framework default (30 s); ignored by images without fail-back.
  EVENTO_FAILBACK_WINDOW_S: ${EVENTO_FAILBACK_WINDOW_S:-}
  # order-command: record the outcome of keyed service commands (payments) in the cell's app
  # database, in the payment's transaction (G5 inbox). "off" reopens the residual window (S18
  # control run); images without the fix ignore it.
  EVENTO_SERVICE_OUTCOME_STORE: ${EVENTO_SERVICE_OUTCOME_STORE:-jdbc}
  # order-command: how long a payment of an order whose id contains "slowpay" waits after its
  # commit before answering (S18 cuts the server off the event store in that gap).
  LAB_PAYMENT_SLOW_MS: ${LAB_PAYMENT_SLOW_MS:-4000}
  JAVA_OPTS: *java-opts

# Per-cell bus: zone + address list "own server first, then the other two through toxiproxy"
# (before G2 only the first is dialled; after G2 the rest are failover targets; after N16
# the bundle also moves back to the first once it has been healthy for the fail-back window).
x-bus-eu: &bus-eu
  EVENTO_ZONE: EU
  EVENTO_SERVER_ADDRESSES: ${BUS_ADDR_EU:-evento-eu:3030,toxi-eu:20123,toxi-eu:20133}
x-bus-am: &bus-am
  EVENTO_ZONE: AM
  EVENTO_SERVER_ADDRESSES: ${BUS_ADDR_AM:-evento-am:3030,toxi-am:20213,toxi-am:20233}
x-bus-apac: &bus-apac
  EVENTO_ZONE: APAC
  EVENTO_SERVER_ADDRESSES: ${BUS_ADDR_APAC:-evento-apac:3030,toxi-apac:20313,toxi-apac:20323}

# Per-cell data: the cell's own app database (primary + local replica, so a promoted replica is
# found after S9) and where order_view_global lives (app-pg-eu, over the WAN for AM / APAC).
x-db-eu: &db-eu
  APP_DB_URL: jdbc:postgresql://app-pg-eu:5432,app-pg-eu-r:5432/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=10
x-db-am: &db-am
  APP_DB_URL: jdbc:postgresql://app-pg-am:5432,app-pg-am-r:5432/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=10
  GLOBAL_VIEW_DB_URL: jdbc:postgresql://toxi-am:20212/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=10
x-db-apac: &db-apac
  APP_DB_URL: jdbc:postgresql://app-pg-apac:5432,app-pg-apac-r:5432/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=10
  GLOBAL_VIEW_DB_URL: jdbc:postgresql://toxi-apac:20312/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=10

# The three regional databases as seen from each cell: the global ALL lane fans out to them
# and a gateway reads them for GET /catalog/prices/{sku}?db=<cell>.
x-targets-eu: &targets-eu
  DATA_TARGETS: >-
    eu=jdbc:postgresql://app-pg-eu:5432,app-pg-eu-r:5432/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=5;
    am=jdbc:postgresql://toxi-eu:20122/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=5;
    apac=jdbc:postgresql://toxi-eu:20132/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=5
x-targets-am: &targets-am
  DATA_TARGETS: >-
    eu=jdbc:postgresql://toxi-am:20212/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=5;
    am=jdbc:postgresql://app-pg-am:5432,app-pg-am-r:5432/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=5;
    apac=jdbc:postgresql://toxi-am:20232/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=5
x-targets-apac: &targets-apac
  DATA_TARGETS: >-
    eu=jdbc:postgresql://toxi-apac:20312/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=5;
    am=jdbc:postgresql://toxi-apac:20322/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=5;
    apac=jdbc:postgresql://app-pg-apac:5432,app-pg-apac-r:5432/app?targetServerType=primary&tcpKeepAlive=true&connectTimeout=5

# Consumer state of the global ALL lane: the shared 'consumers' database on the event-store
# cluster, reached from each cell like the servers reach 'evento'. Every ALL deployment must
# point here: replicas compete for the lane only through a shared lock table.
x-consumers-eu: &consumers-eu
  CONSUMER_STATE_DB_URL: jdbc:postgresql://es-pg-eu:5432,toxi-eu:20121,toxi-eu:20131/consumers?targetServerType=primary&tcpKeepAlive=true&connectTimeout=10
  CONSUMER_STATE_DB_POOL_SIZE: "6"
x-consumers-apac: &consumers-apac
  CONSUMER_STATE_DB_URL: jdbc:postgresql://toxi-apac:20311,toxi-apac:20321,es-pg-apac:5432/consumers?targetServerType=primary&tcpKeepAlive=true&connectTimeout=10
  CONSUMER_STATE_DB_POOL_SIZE: "6"

# Start-up gates shared by every JVM of a cell: its server, its app database and the WAN proxy.
x-deps-eu: &deps-eu
  evento-eu: {condition: service_healthy}
  app-pg-eu: {condition: service_healthy}
  toxiproxy: {condition: service_healthy}
x-deps-am: &deps-am
  evento-am: {condition: service_healthy}
  app-pg-am: {condition: service_healthy}
  toxiproxy: {condition: service_healthy}
x-deps-apac: &deps-apac
  evento-apac: {condition: service_healthy}
  app-pg-apac: {condition: service_healthy}
  toxiproxy: {condition: service_healthy}
# Gateways need no database.
x-gw-deps-eu: &gw-deps-eu
  evento-eu: {condition: service_healthy}
  toxiproxy: {condition: service_healthy}
x-gw-deps-am: &gw-deps-am
  evento-am: {condition: service_healthy}
  toxiproxy: {condition: service_healthy}
x-gw-deps-apac: &gw-deps-apac
  evento-apac: {condition: service_healthy}
  toxiproxy: {condition: service_healthy}

x-command: &command
  <<: *bundle
  image: evento-lab-cluster/order-command:${LAB_TAG:-dev}
  mem_limit: 288m
x-query: &query
  <<: *bundle
  image: evento-lab-cluster/order-query:${LAB_TAG:-dev}
  mem_limit: 256m
x-saga: &saga
  <<: *bundle
  image: evento-lab-cluster/order-saga:${LAB_TAG:-dev}
  mem_limit: 256m
x-observer: &observer
  <<: *bundle
  image: evento-lab-cluster/order-observer:${LAB_TAG:-dev}
  mem_limit: 256m
x-gateway: &gateway
  <<: *bundle
  image: evento-lab-cluster/order-gateway:${LAB_TAG:-dev}
  mem_limit: 256m

# ------------------------------------------------------------------------------------------
networks:
  net-eu:
    name: net-eu
    ipam:
      config: [{subnet: 172.28.1.0/24}]
  net-am:
    name: net-am
    ipam:
      config: [{subnet: 172.28.2.0/24}]
  net-apac:
    name: net-apac
    ipam:
      config: [{subnet: 172.28.3.0/24}]
  wan:
    name: wan
    ipam:
      config: [{subnet: 172.28.9.0/24}]

volumes:
  es-pg-eu-data:
  es-pg-am-data:
  es-pg-apac-data:
  app-pg-eu-data:
  app-pg-eu-r-data:
  app-pg-am-data:
  app-pg-am-r-data:
  app-pg-apac-data:
  app-pg-apac-r-data:

services:
  # ========================================================================================
  # WAN emulation
  # ========================================================================================
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: toxiproxy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"
    # 256m, not 64m: the latency toxic buffers in-flight chunks, and concurrent pg_basebackup
    # streams at start-up got it OOM-killed at 64m (exit 137, L7), which silently cut every
    # WAN link.
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "-h", "localhost:8474", "list"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      net-eu: {aliases: [toxi-eu]}
      net-am: {aliases: [toxi-am]}
      net-apac: {aliases: [toxi-apac]}
      wan: {aliases: [toxi-wan]}

  # Installs the baseline RTT matrix (wan-latency-up/down toxics on all 18 proxies), then
  # idles: it reports healthy once applied, which keeps 'up --wait' happy (a one-shot that
  # exits makes --wait fail) and lets the servers start only after the WAN is in place.
  toxiproxy-init:
    image: nginx:alpine
    container_name: toxiproxy-init
    entrypoint:
      - sh
      - -c
      - sh /toxiproxy/apply-wan.sh && touch /tmp/applied && trap 'exit 0' TERM && while :; do sleep 1; done
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/applied"]
      interval: 2s
      timeout: 2s
      retries: 60
    environment:
      TOXIPROXY_URL: http://toxiproxy:8474
      WAN_LATENCY_SCALE: ${WAN_LATENCY_SCALE:-100}
      WAN_JITTER_MS: ${WAN_JITTER_MS:-5}
    volumes:
      - ./toxiproxy/apply-wan.sh:/toxiproxy/apply-wan.sh:ro
    mem_limit: 32m
    depends_on:
      toxiproxy: {condition: service_healthy}
    networks: [wan]

  # ========================================================================================
  # Event-store Postgres cluster (db 'evento' + db 'consumers'): primary EU, sync AM, async APAC
  # ========================================================================================
  es-pg-eu:
    <<: *pg-primary
    container_name: es-pg-eu
    hostname: es-pg-eu
    # measured ~180-200 MiB with the 3 servers (60 backends); the global lanes add a few.
    mem_limit: 320m
    environment:
      POSTGRES_DB: evento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
      SYNC_STANDBY_NAMES: FIRST 1 (es_pg_am)
      # consumer state of the global ALL lane, replicated with the event store
      EXTRA_DATABASES: consumers
    volumes:
      - es-pg-eu-data:/var/lib/postgresql/data
      - ./pg:/pg:ro
      - ./pg/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports: ["15432:5432"]
    networks: [net-eu]

  es-pg-am:
    <<: *pg-replica
    container_name: es-pg-am
    hostname: es-pg-am
    mem_limit: 192m
    environment:
      POSTGRES_DB: evento
      POSTGRES_PASSWORD: secret
      PRIMARY_HOST: toxi-am
      PRIMARY_PORT: "20211"
      STANDBY_NAME: es_pg_am
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
    volumes:
      - es-pg-am-data:/var/lib/postgresql/data
      - ./pg:/pg:ro
    ports: ["15433:5432"]
    networks: [net-am]
    depends_on:
      es-pg-eu: {condition: service_healthy}
      toxiproxy: {condition: service_healthy}

  es-pg-apac:
    <<: *pg-replica
    container_name: es-pg-apac
    hostname: es-pg-apac
    mem_limit: 192m
    environment:
      POSTGRES_DB: evento
      POSTGRES_PASSWORD: secret
      PRIMARY_HOST: toxi-apac
      PRIMARY_PORT: "20311"
      STANDBY_NAME: es_pg_apac
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
    volumes:
      - es-pg-apac-data:/var/lib/postgresql/data
      - ./pg:/pg:ro
    ports: ["15434:5432"]
    networks: [net-apac]
    depends_on:
      es-pg-eu: {condition: service_healthy}
      toxiproxy: {condition: service_healthy}

  # ========================================================================================
  # Regional app data (db 'app'): one independent primary per cell + one local async replica.
  # Read models (order_view, order_view_global), catalog_price (fanned out by the ALL lane),
  # side effects and the JDBC consumer state of the cell's deployments (L5).
  # ========================================================================================
  app-pg-eu:
    <<: *pg-primary
    container_name: app-pg-eu
    hostname: app-pg-eu
    mem_limit: 256m
    environment: &app-pg-primary-env
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
    volumes:
      - app-pg-eu-data:/var/lib/postgresql/data
      - ./pg:/pg:ro
      - ./pg/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports: ["25432:5432"]
    networks: [net-eu]

  app-pg-eu-r:
    <<: *pg-replica
    container_name: app-pg-eu-r
    hostname: app-pg-eu-r
    mem_limit: 96m
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: secret
      PRIMARY_HOST: app-pg-eu
      PRIMARY_PORT: "5432"
      STANDBY_NAME: app_pg_eu_r
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
    volumes:
      - app-pg-eu-r-data:/var/lib/postgresql/data
      - ./pg:/pg:ro
    ports: ["25442:5432"]
    networks: [net-eu]
    depends_on:
      app-pg-eu: {condition: service_healthy}

  app-pg-am:
    <<: *pg-primary
    container_name: app-pg-am
    hostname: app-pg-am
    mem_limit: 256m
    environment: *app-pg-primary-env
    volumes:
      - app-pg-am-data:/var/lib/postgresql/data
      - ./pg:/pg:ro
      - ./pg/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports: ["25433:5432"]
    networks: [net-am]

  app-pg-am-r:
    <<: *pg-replica
    container_name: app-pg-am-r
    hostname: app-pg-am-r
    mem_limit: 96m
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: secret
      PRIMARY_HOST: app-pg-am
      PRIMARY_PORT: "5432"
      STANDBY_NAME: app_pg_am_r
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
    volumes:
      - app-pg-am-r-data:/var/lib/postgresql/data
      - ./pg:/pg:ro
    ports: ["25443:5432"]
    networks: [net-am]
    depends_on:
      app-pg-am: {condition: service_healthy}

  app-pg-apac:
    <<: *pg-primary
    container_name: app-pg-apac
    hostname: app-pg-apac
    mem_limit: 256m
    environment: *app-pg-primary-env
    volumes:
      - app-pg-apac-data:/var/lib/postgresql/data
      - ./pg:/pg:ro
      - ./pg/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports: ["25434:5432"]
    networks: [net-apac]

  app-pg-apac-r:
    <<: *pg-replica
    container_name: app-pg-apac-r
    hostname: app-pg-apac-r
    mem_limit: 96m
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: secret
      PRIMARY_HOST: app-pg-apac
      PRIMARY_PORT: "5432"
      STANDBY_NAME: app_pg_apac_r
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
    volumes:
      - app-pg-apac-r-data:/var/lib/postgresql/data
      - ./pg:/pg:ro
    ports: ["25444:5432"]
    networks: [net-apac]
    depends_on:
      app-pg-apac: {condition: service_healthy}

  # ========================================================================================
  # Evento servers: one per cell, CPES, unique identity (G13), health-chained start (G14)
  # ========================================================================================
  evento-eu:
    <<: *server
    container_name: evento-eu
    hostname: evento-eu
    environment:
      <<: *server-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://es-pg-eu:5432,toxi-eu:20121,toxi-eu:20131/evento?targetServerType=primary&tcpKeepAlive=true&connectTimeout=10
      EVENTO_CLUSTER_NODE_SERVER_ID: evento-eu
      EVENTO_SERVER_INSTANCE_ID: evento-eu
    ports: ["13000:3000"]
    networks: [net-eu]
    depends_on:
      es-pg-eu: {condition: service_healthy}
      # The sync standby must be streaming or every commit on the primary blocks.
      es-pg-am: {condition: service_healthy}
      toxiproxy-init: {condition: service_healthy}

  evento-am:
    <<: *server
    container_name: evento-am
    hostname: evento-am
    environment:
      <<: *server-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://toxi-am:20211,es-pg-am:5432,toxi-am:20231/evento?targetServerType=primary&tcpKeepAlive=true&connectTimeout=10
      EVENTO_CLUSTER_NODE_SERVER_ID: evento-am
      EVENTO_SERVER_INSTANCE_ID: evento-am
    ports: ["13001:3000"]
    networks: [net-am]
    depends_on:
      evento-eu: {condition: service_healthy}
      toxiproxy-init: {condition: service_healthy}

  evento-apac:
    <<: *server
    container_name: evento-apac
    hostname: evento-apac
    environment:
      <<: *server-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://toxi-apac:20311,toxi-apac:20321,es-pg-apac:5432/evento?targetServerType=primary&tcpKeepAlive=true&connectTimeout=10
      EVENTO_CLUSTER_NODE_SERVER_ID: evento-apac
      EVENTO_SERVER_INSTANCE_ID: evento-apac
    ports: ["13002:3000"]
    networks: [net-apac]
    depends_on:
      evento-am: {condition: service_healthy}
      toxiproxy-init: {condition: service_healthy}

  # ========================================================================================
  # Load balancer: HTTP geo ingress on :8080 + per-cell bus VIPs (bus-<cell>:3030)
  # ========================================================================================
  lb:
    image: nginx:alpine
    container_name: lb
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:8080"]
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/lb/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      net-eu: {ipv4_address: 172.28.1.10, aliases: [bus-eu]}
      net-am: {ipv4_address: 172.28.2.10, aliases: [bus-am]}
      net-apac: {ipv4_address: 172.28.3.10, aliases: [bus-apac]}
      wan: {}

  # ========================================================================================
  # order-command: the full command side, once per cell (cell architecture, G1)
  # ========================================================================================
  order-command-eu:
    <<: *command
    container_name: order-command-eu
    hostname: order-command-eu
    environment:
      <<: [*env-common, *bus-eu, *db-eu]
      EVENTO_INSTANCE_ID: order-command-eu
    networks: [net-eu]
    depends_on: *deps-eu

  # Second EU replica, only for S2 (handler failover inside one cell): --profile replica
  order-command-eu-b:
    <<: *command
    container_name: order-command-eu-b
    hostname: order-command-eu-b
    profiles: [replica]
    environment:
      <<: [*env-common, *bus-eu, *db-eu]
      EVENTO_INSTANCE_ID: order-command-eu-b
    networks: [net-eu]
    depends_on: *deps-eu

  order-command-am:
    <<: *command
    container_name: order-command-am
    hostname: order-command-am
    environment:
      <<: [*env-common, *bus-am, *db-am]
      EVENTO_INSTANCE_ID: order-command-am
    networks: [net-am]
    depends_on: *deps-am

  order-command-apac:
    <<: *command
    container_name: order-command-apac
    hostname: order-command-apac
    environment:
      <<: [*env-common, *bus-apac, *db-apac]
      EVENTO_INSTANCE_ID: order-command-apac
    networks: [net-apac]
    depends_on: *deps-apac

  # ========================================================================================
  # order-query: one OrderProjector + one CatalogProjector; EVENTO_CONTEXTS picks the engines.
  #   regional (region list) -> one OrderProjector engine per region into the cell's order_view
  #   ALL                    -> the single global lane (CatalogProjector), fan-out to every cell DB
  #   *                      -> OrderProjector over every context into order_view_global
  # All share bundle id 'order-query'; lanes differ by context (order-query_OrderProjector_1_CINA).
  # ========================================================================================
  order-query-eu:
    <<: *query
    container_name: order-query-eu
    hostname: order-query-eu
    environment:
      <<: [*env-common, *bus-eu, *db-eu]
      EVENTO_INSTANCE_ID: order-query-eu
      EVENTO_CONTEXTS: EUROPA,AFRICA        # two engines in one JVM
    networks: [net-eu]
    depends_on: *deps-eu

  order-query-am:
    <<: *query
    container_name: order-query-am
    hostname: order-query-am
    environment:
      <<: [*env-common, *bus-am, *db-am]
      EVENTO_INSTANCE_ID: order-query-am
      EVENTO_CONTEXTS: AMERICA,SUD_AMERICA
    networks: [net-am]
    depends_on: *deps-am

  order-query-cina:
    <<: *query
    container_name: order-query-cina
    hostname: order-query-cina
    environment:
      <<: [*env-common, *bus-apac, *db-apac]
      EVENTO_INSTANCE_ID: order-query-cina
      EVENTO_CONTEXTS: CINA                 # one region, one JVM
    networks: [net-apac]
    depends_on: *deps-apac

  order-query-apac:
    <<: *query
    container_name: order-query-apac
    hostname: order-query-apac
    environment:
      <<: [*env-common, *bus-apac, *db-apac]
      EVENTO_INSTANCE_ID: order-query-apac
      EVENTO_CONTEXTS: INDIA,AUSTRALIA_NZ
    networks: [net-apac]
    depends_on: *deps-apac

  # The single global lane, two replicas in two cells competing for it (one projects, one
  # stands by). They share bundle id and the 'consumers' state database, which is what makes
  # them compete; each fans out to all three regional databases.
  order-query-global-eu:
    <<: *query
    container_name: order-query-global-eu
    hostname: order-query-global-eu
    environment:
      <<: [*env-common, *bus-eu, *db-eu, *targets-eu, *consumers-eu]
      EVENTO_INSTANCE_ID: order-query-global-eu
      EVENTO_CONTEXTS: ALL                  # the literal context "ALL", NOT the wildcard "*"
    networks: [net-eu]
    depends_on: *deps-eu

  order-query-global-apac:
    <<: *query
    container_name: order-query-global-apac
    hostname: order-query-global-apac
    environment:
      <<: [*env-common, *bus-apac, *db-apac, *targets-apac, *consumers-apac]
      EVENTO_INSTANCE_ID: order-query-global-apac
      EVENTO_CONTEXTS: ALL
    networks: [net-apac]
    depends_on: *deps-apac

  # The world-wide order view (I5): every context, into order_view_global on app-pg-eu.
  order-query-wildcard:
    <<: *query
    container_name: order-query-wildcard
    hostname: order-query-wildcard
    environment:
      <<: [*env-common, *bus-eu, *db-eu]
      EVENTO_INSTANCE_ID: order-query-wildcard
      EVENTO_CONTEXTS: "*"
    networks: [net-eu]
    depends_on: *deps-eu

  # ========================================================================================
  # order-saga: one PaymentSaga, one engine per region of the cell; payments run in-cell
  # ========================================================================================
  order-saga-eu:
    <<: *saga
    container_name: order-saga-eu
    hostname: order-saga-eu
    environment:
      <<: [*env-common, *bus-eu, *db-eu]
      EVENTO_INSTANCE_ID: order-saga-eu
      EVENTO_CONTEXTS: EUROPA,AFRICA
    networks: [net-eu]
    depends_on: *deps-eu

  order-saga-am:
    <<: *saga
    container_name: order-saga-am
    hostname: order-saga-am
    environment:
      <<: [*env-common, *bus-am, *db-am]
      EVENTO_INSTANCE_ID: order-saga-am
      EVENTO_CONTEXTS: AMERICA,SUD_AMERICA
    networks: [net-am]
    depends_on: *deps-am

  order-saga-apac:
    <<: *saga
    container_name: order-saga-apac
    hostname: order-saga-apac
    environment:
      <<: [*env-common, *bus-apac, *db-apac]
      EVENTO_INSTANCE_ID: order-saga-apac
      EVENTO_CONTEXTS: CINA,INDIA,AUSTRALIA_NZ
    networks: [net-apac]
    depends_on: *deps-apac

  # ========================================================================================
  # order-observer: one '*' lane (the audit of every order event, in app-pg-eu). Per-cell
  # regional observers are the same image with other contexts: --profile regional-observers
  # (own bundle id, so they are separate lanes and never compete with the '*' one).
  # ========================================================================================
  order-observer:
    <<: *observer
    container_name: order-observer
    hostname: order-observer
    environment:
      <<: [*env-common, *bus-eu, *db-eu]
      EVENTO_INSTANCE_ID: order-observer
      EVENTO_CONTEXTS: "*"
    networks: [net-eu]
    depends_on: *deps-eu

  order-observer-eu:
    <<: *observer
    container_name: order-observer-eu
    hostname: order-observer-eu
    profiles: [regional-observers]
    environment:
      <<: [*env-common, *bus-eu, *db-eu]
      EVENTO_BUNDLE_ID: order-observer-regional
      EVENTO_INSTANCE_ID: order-observer-eu
      EVENTO_CONTEXTS: EUROPA,AFRICA
    networks: [net-eu]
    depends_on: *deps-eu

  order-observer-am:
    <<: *observer
    container_name: order-observer-am
    hostname: order-observer-am
    profiles: [regional-observers]
    environment:
      <<: [*env-common, *bus-am, *db-am]
      EVENTO_BUNDLE_ID: order-observer-regional
      EVENTO_INSTANCE_ID: order-observer-am
      EVENTO_CONTEXTS: AMERICA,SUD_AMERICA
    networks: [net-am]
    depends_on: *deps-am

  order-observer-apac:
    <<: *observer
    container_name: order-observer-apac
    hostname: order-observer-apac
    profiles: [regional-observers]
    environment:
      <<: [*env-common, *bus-apac, *db-apac]
      EVENTO_BUNDLE_ID: order-observer-regional
      EVENTO_INSTANCE_ID: order-observer-apac
      EVENTO_CONTEXTS: CINA,INDIA,AUSTRALIA_NZ
    networks: [net-apac]
    depends_on: *deps-apac

  # ========================================================================================
  # order-gateway: HTTP :8080 per region behind the lb; no consumers, no database of its own
  # (DATA_TARGETS only serves the diagnostic GET /catalog/prices/{sku}?db=<cell>)
  # ========================================================================================
  gateway-europa:
    <<: *gateway
    container_name: gateway-europa
    hostname: gateway-europa
    environment:
      <<: [*env-common, *bus-eu, *targets-eu]
      EVENTO_INSTANCE_ID: gateway-europa
      EVENTO_REGION: EUROPA
    networks: [net-eu]
    depends_on: *gw-deps-eu

  gateway-africa:
    <<: *gateway
    container_name: gateway-africa
    hostname: gateway-africa
    environment:
      <<: [*env-common, *bus-eu, *targets-eu]
      EVENTO_INSTANCE_ID: gateway-africa
      EVENTO_REGION: AFRICA
    networks: [net-eu]
    depends_on: *gw-deps-eu

  gateway-america:
    <<: *gateway
    container_name: gateway-america
    hostname: gateway-america
    environment:
      <<: [*env-common, *bus-am, *targets-am]
      EVENTO_INSTANCE_ID: gateway-america
      EVENTO_REGION: AMERICA
    networks: [net-am]
    depends_on: *gw-deps-am

  gateway-sud-america:
    <<: *gateway
    container_name: gateway-sud-america
    hostname: gateway-sud-america
    environment:
      <<: [*env-common, *bus-am, *targets-am]
      EVENTO_INSTANCE_ID: gateway-sud-america
      EVENTO_REGION: SUD_AMERICA
    networks: [net-am]
    depends_on: *gw-deps-am

  gateway-cina:
    <<: *gateway
    container_name: gateway-cina
    hostname: gateway-cina
    environment:
      <<: [*env-common, *bus-apac, *targets-apac]
      EVENTO_INSTANCE_ID: gateway-cina
      EVENTO_REGION: CINA
    networks: [net-apac]
    depends_on: *gw-deps-apac

  gateway-india:
    <<: *gateway
    container_name: gateway-india
    hostname: gateway-india
    environment:
      <<: [*env-common, *bus-apac, *targets-apac]
      EVENTO_INSTANCE_ID: gateway-india
      EVENTO_REGION: INDIA
    networks: [net-apac]
    depends_on: *gw-deps-apac

  gateway-australia-nz:
    <<: *gateway
    container_name: gateway-australia-nz
    hostname: gateway-australia-nz
    environment:
      <<: [*env-common, *bus-apac, *targets-apac]
      EVENTO_INSTANCE_ID: gateway-australia-nz
      EVENTO_REGION: AUSTRALIA_NZ
    networks: [net-apac]
    depends_on: *gw-deps-apac
