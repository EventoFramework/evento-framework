version: 2
# Minor and patch updates of an ecosystem arrive together in one PR a week; a major
# update keeps a PR of its own, since each needs its own review.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - gradle
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The starter's boot3Test runs on Spring Boot 3.5 on purpose (boot3Version): a
      # major bump would make it a second 4.x run. Majors of Spring Boot move by hand.
      - dependency-name: org.springframework.boot:spring-boot-dependencies
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /evento-gui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # Majors held back by peer ranges we do not control. Drop the entry once the
    # blocking package ships support.
    ignore:
      # eslint-plugin-import@2.32.0 (latest) peers eslint@"...||^9".
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # Angular 22 (@angular/compiler-cli, @angular/build) peers typescript@">=6.0 <6.1".
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    groups:
      # Every step of a workflow must run the same codeql-action version (init and
      # analyze refuse to mix), so its actions move together, majors included.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
