name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run core tests
        run: |
          ./gradlew --no-daemon \
            :evento-transport-api:test \
            :evento-transport-netty:test \
            :evento-server:test \
            :evento-common:test \
            :evento-bundle:test \
            :evento-lab:test \
            :evento-lab-microservices:evento-lab-ms-it:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  jdbc-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      # GitHub-hosted ubuntu runners ship Docker, so the Testcontainers-gated JDBC
      # ITs (Postgres + MySQL, incl. PgDistributedLockIT) run here — unlike a local
      # Docker Desktop, which can hit a Testcontainers/Docker API mismatch.
      - name: Run JDBC integration tests (Testcontainers)
        env:
          EVENTO_RUN_JDBC_IT: "true"
        run: |
          ./gradlew --no-daemon \
            :evento-consumer-state-store:evento-consumer-state-store-jdbc:test

      - name: Upload JDBC IT reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jdbc-it-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  gui-build:
    # The evento-gui frontend is embedded in the boot jar by release.yml but was
    # never exercised in PR CI, so frontend dependency bumps (e.g. Angular majors)
    # could merge green while breaking the production build. Run the same steps
    # release.yml does — resolve deps and run the production build — plus lint.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: evento-gui/package-lock.json

      # `npm ci` installs exactly the hash-pinned tree from package-lock.json
      # (Scorecard Pinned-Dependencies). The lockfile is regenerated with npm 11
      # and records every platform's optional native deps, so it resolves on the
      # Linux runner without the old `npm install` fallback.
      - name: Install GUI dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ./evento-gui

      - name: Lint
        run: npx ng lint
        working-directory: ./evento-gui

      # Build via the npm script (`ng build`) rather than a globally-installed,
      # unpinned Ionic CLI — same production output, embedded into the boot jar.
      - name: Build (production)
        run: npm run build -- --configuration production
        working-directory: ./evento-gui
