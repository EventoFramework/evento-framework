name: Publish to Maven Central

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uncached: this workflow only runs on a fresh `v*` tag, and Actions caches
      # are scoped to the writing ref — a cache saved here is unreadable by the
      # next release, so it would only burn repo cache quota. Same rationale as
      # release.yml.
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: corretto
          java-version: '25'

      # Uploads signed artifacts to the Sonatype ossrh-staging-api staging
      # repository. Credentials and the in-memory GPG key are read from the
      # environment (see evento-*/build.gradle). Scoped to the Central
      # repository only — GitHub Packages is handled by release.yml.
      - name: Publish to staging
        run: ./gradlew --no-daemon publishAllPublicationsToOssrh-staging-apiRepository
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      # Promotes the staged com.eventoframework namespace for release
      # (publishing_type=automatic), the same finalization done locally.
      - name: Promote staging to Central
        run: python3 publish.py
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
