spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
server.port=3000
evento.server.bus.enabled=true
evento.server.bus.port=3030
evento.server.bus.server-instance-id=${evento.cluster.node.server.id}
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
application.version=@version@
# Announced to bundles in Welcome.clusterName. Set it per deployment (EVENTO_CLUSTER_NAME): a bundle
# that requires "evento-server" is not protected against another deployment's broker that also
# kept this shipped value (the server logs event=cluster_name_shipped_default when it is kept).
evento.cluster.name=${EVENTO_CLUSTER_NAME:evento-server}
## MULTIPART (MultipartProperties)
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB
## File Storage Properties
# All files uploaded through the REST API will be stored in this directory
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.loginTimeout=30
spring.datasource.hikari.data-source-properties.connectTimeout=30
spring.datasource.hikari.data-source-properties.socketTimeout=30
# Held distributed locks pin connections from a pool of their own (evento.lock.pool.*, see
# DistributedLockConfiguration), never from this one, so lock holders cannot starve the work they
# hold the lock for. Keep servers x (maximum-pool-size + evento.lock.pool.maximum-size) under
# PostgreSQL's max_connections: the shipped 20 + 10 is 30 per server at peak, 90 for three
# servers, within PostgreSQL's default max_connections=100. Idle, a server keeps 5 + 2 open.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# The most locks (locked commands, discovery, consumer registration) one server holds at once;
# further acquirers wait, bounded by evento.lock.acquire.timeout.ms (or by the command's deadline).
evento.lock.pool.maximum-size=10
evento.lock.pool.connection-timeout-ms=1000
# Bound on any distributed lock wait (Spring property / EVENTO_LOCK_ACQUIRE_TIMEOUT_MS; the JVM
# system property -Devento.lock.acquire.timeout.ms is the fallback when this is unset).
evento.lock.acquire.timeout.ms=60000
# Two scheduler threads: the presence heartbeat (evento.server.presence.*) must not queue behind
# the hourly telemetry sweep, whose deletes can each run up to socketTimeout.
spring.task.scheduling.pool.size=2
spring.mvc.async.request-timeout=3000000
# Static GUI login (HTTP Basic). The user carries the WEB and ADMIN roles required by the
# controllers' @Secured annotations. Override both in any real deployment.
spring.security.user.name=${SPRING_SECURITY_USER_NAME:evento}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:secret}
spring.security.user.roles=WEB,ADMIN
spring.sql.init.mode=always
# Wire-level bundle auth: leave blank to accept all bundles (dev), or set a shared secret to require it.
evento.server.bus.auth-token=${EVENTO_SERVER_BUS_AUTH_TOKEN:}
# dev: list the hardening that is off and start anyway; prod: refuse to start until bus token, bus TLS,
# deserialization allowlist, GUI and database passwords and CORS origins are all set (SecurityProfileGuard).
# prod (the default since 3.0): the server does not start without a bus token, bus TLS, a payload
# allowlist, non-default passwords and explicit CORS origins. dev: it starts and lists what is off.
evento.server.security.profile=${EVENTO_SERVER_SECURITY_PROFILE:prod}
# TLS on the bus port (PEM files; the key in PKCS#8). client-auth=require turns on mutual TLS and needs
# trust-certs, the CAs that sign the bundles' certificates.
evento.server.bus.tls.enabled=${EVENTO_SERVER_BUS_TLS_ENABLED:false}
evento.server.bus.tls.cert-chain=${EVENTO_SERVER_BUS_TLS_CERT_CHAIN:}
evento.server.bus.tls.private-key=${EVENTO_SERVER_BUS_TLS_PRIVATE_KEY:}
evento.server.bus.tls.private-key-password=${EVENTO_SERVER_BUS_TLS_PRIVATE_KEY_PASSWORD:}
evento.server.bus.tls.trust-certs=${EVENTO_SERVER_BUS_TLS_TRUST_CERTS:}
evento.server.bus.tls.client-auth=${EVENTO_SERVER_BUS_TLS_CLIENT_AUTH:none}
# Web console sign-in: basic (the user above) or oidc (single sign-on with the organisation's identity
# provider: a client registration spring.security.oauth2.client.registration.evento.*, and
# evento.server.web.oidc.{registration-id,roles-claim,web-role,admin-role}). The server refuses to start
# if no sign-in provides the mode.
evento.server.web.auth=${EVENTO_SERVER_WEB_AUTH:basic}
# Origins allowed to call the REST API from a browser, comma-separated; * only for development.
evento.server.web.cors.allowed-origins=${EVENTO_SERVER_WEB_CORS_ALLOWED_ORIGINS:*}
# Handler pick: random (default), first, or locality-preferred (same zone as the requesting bundle, then any).
evento.server.bus.pick-strategy=${EVENTO_SERVER_BUS_PICK_STRATEGY:random}
evento.performance.capture.rate=1
evento.telemetry.ttl=365
evento.server.instance.id=server-0
logging.pattern.console=%clr(%d{YYYYMMddHHmmssSSS}){faint} %clr(%-5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%-40t]){cyan} %clr(%-40logger{0}){blue} %clr(:){red} %clr(%m){faint}%n


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/evento}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
evento.cluster.node.server.id=iris-evento-server
evento.bundle.autorun=false
evento.bundle.instances.min=1
evento.bundle.instances.max=1
server.address=0.0.0.0
#logging.level.com.evento=debug
logging.level.com.evento.server.bus.registry.ConnectionRegistry=trace
# CPES (default). APES is deprecated since 3.0; an APES store switches by restarting every server in CPES.
evento.es.mode=CPES
# Wraps the keys of data subjects (@PersonalData) at rest: base64 of 32 random bytes, the same on
# every server. Unset, the keys are stored as they are (a warning is logged when the first is made).
evento.server.personal-data.master-key=${EVENTO_SERVER_PERSONAL_DATA_MASTER_KEY:}

## Observability (Spring Boot Actuator + Micrometer/Prometheus)
management.endpoints.web.exposure.include=health,info,prometheus,metrics,auditevents
# auditevents: the console's audit trail (ADMIN only; also one line per event on the evento.audit logger).
# management.auditevents.enabled=false turns it off; evento.server.audit.capacity (1000) events kept.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

