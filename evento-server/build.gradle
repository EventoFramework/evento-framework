plugins {
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
}

group = 'com.evento'
version = "${eventoVersion}"
java {
	toolchain {
		languageVersion = javaLanguageVersion
	}
}


configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	mavenLocal()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    compileOnly "org.projectlombok:lombok:${lombokVersion}"

	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'com.google.code.gson:gson:2.10.1'

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.flywaydb:flyway-core'
	implementation 'com.squareup.okhttp3:okhttp:5.4.0'


	implementation project(':evento-common')
	implementation project(':evento-transport-api')
	implementation project(':evento-transport-netty')

	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.awaitility:awaitility:4.3.0'
	testImplementation "io.netty:netty-pkitesting:${nettyVersion}"
	testImplementation project(':evento-bundle')
	testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
	testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
}

tasks.register('prepareKotlinBuildScriptModel') {

}

processResources {
	filesMatching('application.properties') {
		filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [version: eventoVersion])
	}
}

test {
	useJUnitPlatform()
	jvmArgs '-Xmx2g'
	// Testcontainers-based ITs (gated on EVENTO_RUN_JDBC_IT=true). Forward DOCKER_HOST
	// only when set: Testcontainers' own lookup finds the Windows named pipe and the
	// Linux socket, and a forced unix:// default would break the former.
	def dockerHost = System.getenv("DOCKER_HOST")
	if (dockerHost) environment "DOCKER_HOST", dockerHost
	environment "TESTCONTAINERS_RYUK_DISABLED", "true"
	// Same Docker Engine API pin as the JDBC state-store module: 1.40 is accepted both
	// by recent Docker Desktop daemons and by older CI engines.
	systemProperty "api.version", System.getProperty("api.version") ?: "1.40"
}
