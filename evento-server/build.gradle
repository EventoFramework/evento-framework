plugins {
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
}

group = 'com.evento'
version = "${eventoVersion}"
java {
	toolchain {
		languageVersion = javaLanguageVersion
	}
}


configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	mavenLocal()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Single sign-on for the web console (evento.server.web.auth=oidc).
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // Command spans (CommandTracing): the API only, a no-op unless the OpenTelemetry Java agent
    // or an OpenTelemetry bean provides an SDK.
    implementation "io.opentelemetry:opentelemetry-api:${openTelemetryVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"

	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	implementation 'com.google.code.gson:gson:2.10.1'

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.flywaydb:flyway-core'
	implementation 'com.squareup.okhttp3:okhttp:5.5.0'


	implementation project(':evento-common')
	implementation project(':evento-transport-api')
	implementation project(':evento-transport-netty')

	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.awaitility:awaitility:4.3.0'
	testImplementation "io.netty:netty-pkitesting:${nettyVersion}"
	testImplementation "io.opentelemetry:opentelemetry-sdk-testing:${openTelemetryVersion}"
	testImplementation "io.opentelemetry:opentelemetry-sdk:${openTelemetryVersion}"
	testImplementation project(':evento-bundle')
	// The JDBC service-outcome store, for the G5 residual-window IT. Its Flyway is left out: the
	// IT runs the migration script directly, and the server's own tests keep the Boot-managed one.
	testImplementation(project(':evento-consumer-state-store:evento-consumer-state-store-jdbc')) {
		exclude group: 'org.flywaydb'
	}
	// Real-Postgres ITs for the event store, locks and schema init (gated by EVENTO_RUN_JDBC_IT).
	// Versions come from Spring Boot's Testcontainers 2.x BOM.
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

tasks.register('prepareKotlinBuildScriptModel') {

}

processResources {
	filesMatching('application.properties') {
		filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [version: eventoVersion])
	}
}

test {
	useJUnitPlatform()
	jvmArgs '-Xmx2g'
	// Testcontainers-based ITs only run with EVENTO_RUN_JDBC_IT=true. Forward DOCKER_HOST when
	// set, and pin the Docker Engine API version docker-java negotiates (see the same block in
	// evento-consumer-state-store-jdbc for why 1.40).
	if (System.getenv("DOCKER_HOST")) {
		environment "DOCKER_HOST", System.getenv("DOCKER_HOST")
	}
	systemProperty "api.version", System.getProperty("api.version") ?: "1.40"
}
