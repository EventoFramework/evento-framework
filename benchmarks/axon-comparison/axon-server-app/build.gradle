// The same application on Axon Server (Axoniq Framework connector, Axoniq Terms of Service):
// for internal comparison only. The Terms forbid disclosing benchmark results outside your
// organisation without Axoniq's written consent; results go to results-private/ (git-ignored).
plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

sourceSets {
    main {
        java { srcDir '../axon-app/src/main/java' }
    }
}

// Axon Framework 5.4 uses Jackson 3.2, which needs jackson-annotations 2.22; Spring Boot 3.5's
// dependency management would pin 2.21 (NoClassDefFoundError: JsonApplyView).
dependencyManagement {
    dependencies {
        dependency 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    }
}

dependencies {
    implementation project(':bench-core')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.axonframework.extensions.spring:axon-spring-boot-starter:5.4.0'
    implementation 'io.axoniq.framework:axoniq-spring-boot-starter:5.4.0'
}

jar { enabled = false }
bootJar { archiveFileName = 'axon-server-app.jar' }
