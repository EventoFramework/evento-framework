spring.main.web-application-type=none
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/axon}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}
# Axon's JPA entities (events, tokens) are created by Hibernate: the setup of its quick start.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
