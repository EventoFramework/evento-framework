pluginManagement {
	repositories {
		mavenLocal()
		maven { url = 'https://repo.spring.io/release' }
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'evento'
include 'evento-server'
include 'evento-common'
include 'evento-bundle'
include 'evento-transport-api'
include 'evento-transport-netty'
include 'evento-consumer-state-store:evento-consumer-state-store-jdbc'


include 'evento-lab'
include 'evento-lab-microservices:evento-lab-ms-api'
include 'evento-lab-microservices:evento-lab-ms-command'
include 'evento-lab-microservices:evento-lab-ms-query'
include 'evento-lab-microservices:evento-lab-ms-saga'
include 'evento-lab-microservices:evento-lab-ms-observer'
include 'evento-lab-microservices:evento-lab-ms-it'

// evento-lab-cluster: one module per bundle, each deployed by configuration only
include 'evento-lab-cluster:lab-api'
include 'evento-lab-cluster:lab-support'
include 'evento-lab-cluster:order-command'
include 'evento-lab-cluster:order-query'
include 'evento-lab-cluster:order-saga'
include 'evento-lab-cluster:order-observer'
include 'evento-lab-cluster:order-gateway'
include 'evento-lab-cluster:evento-lab-cluster-chaos'
