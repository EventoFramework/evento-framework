ext.libraryName = 'Evento Framework - Spring Boot Starter'
ext.libraryDescription = 'Auto-configuration that runs an Evento bundle inside a Spring Boot application'
apply from: rootProject.file('gradle/evento-library.gradle')

// Compiled against the Spring Boot API that 3.x and 4.x share, and not exported: the
// application's own Spring Boot version is the one that runs. Tested on both (see boot3Test).
def bootVersion = '4.1.2'
def boot3Version = '4.1.2'

// The Spring Boot version of the tests, kept out of testImplementation so boot3Test can swap it.
configurations {
    bootTestPlatform {
        canBeConsumed = false
        canBeResolved = false
    }
    testCompileClasspath.extendsFrom bootTestPlatform
    testRuntimeClasspath.extendsFrom bootTestPlatform
}

dependencies {
    api project(':evento-bundle')

    compileOnly platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    // Optional integrations, switched on by what the application has on its classpath.
    compileOnly project(':evento-consumer-state-store:evento-consumer-state-store-jdbc')
    compileOnly project(':evento-opentelemetry')
    compileOnly 'io.micrometer:micrometer-core'

    bootTestPlatform platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'io.micrometer:micrometer-core'
    testImplementation 'org.springframework:spring-test'
    testImplementation project(':evento-opentelemetry')
    testImplementation project(':evento-consumer-state-store:evento-consumer-state-store-jdbc')
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:${openTelemetryVersion}"
    testImplementation "io.opentelemetry:opentelemetry-sdk:${openTelemetryVersion}"
    // A real broker over TCP for the end-to-end test.
    testImplementation project(':evento-server')
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation 'org.awaitility:awaitility:4.3.0'
}

// The same tests with Spring Boot 3.5 on the classpath instead of 4.x.
configurations {
    boot3TestRuntimeClasspath {
        extendsFrom configurations.testImplementation, configurations.testRuntimeOnly
        canBeConsumed = false
        canBeResolved = true
    }
}
dependencies {
    boot3TestRuntimeClasspath enforcedPlatform("org.springframework.boot:spring-boot-dependencies:${boot3Version}")
}
def boot3Test = tasks.register('boot3Test', Test) {
    description = 'Runs the starter tests against Spring Boot ' + boot3Version
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.boot3TestRuntimeClasspath
}
tasks.named('check') { dependsOn boot3Test }

// The published code targets the client baseline (root build.gradle); the tests run a real broker,
// and the server is built for 25, so the test side is compiled and resolved for 25.
tasks.named('compileTestJava') { options.release = 25 }
[configurations.testCompileClasspath, configurations.testRuntimeClasspath, configurations.boot3TestRuntimeClasspath].each {
    it.attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25) }
}
