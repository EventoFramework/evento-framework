plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'com.eventoframework'
version = "${eventoVersion}"
java {
    toolchain {
        languageVersion = javaLanguageVersion
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':evento-transport-api')

    api "io.netty:netty-handler:${nettyVersion}"
    api "io.netty:netty-codec:${nettyVersion}"
    api "io.netty:netty-transport:${nettyVersion}"
    api "io.netty:netty-buffer:${nettyVersion}"
    implementation "org.lz4:lz4-java:${lz4Version}"
    api 'org.slf4j:slf4j-api:2.0.16'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.2'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
    testImplementation project(':evento-transport-api')
}

test {
    useJUnitPlatform()
}

// Regression guard: this module must run on Netty 4.1. evento-bundle lives inside
// user Spring Boot apps whose BOM manages io.netty:* down to the 4.1 line no matter
// what we declare, so any 4.2-only API here breaks every unpinned Boot app at
// startup (happened in 2.4.4: MultiThreadIoEventLoopGroup -> NoClassDefFoundError,
// caught on the live demo). This task reruns the full transport test suite with
// Netty forced to 4.1 and is wired into `check`, so CI fails before release does.
def netty41Version = '4.1.124.Final'

def netty41Classpath = configurations.testRuntimeClasspath.copyRecursive()
netty41Classpath.resolutionStrategy.eachDependency { details ->
    if (details.requested.group == 'io.netty') {
        details.useVersion netty41Version
        details.because 'Spring Boot BOMs pin Netty 4.1 in user apps'
    }
}

tasks.register('netty41Test', Test) {
    description = "Runs the transport tests with Netty forced to ${netty41Version} (Spring Boot BOM compatibility)."
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.output + sourceSets.main.output + netty41Classpath
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn 'netty41Test'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = group
            artifactId = 'evento-transport-netty'
            version = version
            from components.java
            pom {
                name = "Evento Framework - Transport (Netty)"
                description = "Netty-based transport implementation for the Evento Framework, with CBOR codec and length-prefixed framing"
                url = "https://www.eventoframework.com/"
                licenses {
                    license {
                        name = "Dual License: AGPL-3.0 or Commercial"
                        url = "https://www.eventoframework.com/licensing"
                    }
                }
                developers {
                    developer {
                        id = "gaborgalazzo"
                        name = "Gabor Galazzo"
                        email = "gabor.galazzo@gmail.com"
                    }
                }
                scm {
                    connection = "scm:git:git://github.com/EventoFramework/evento-framework.git"
                    developerConnection = "scm:git:ssh://github.com/EventoFramework/evento-framework.git"
                    url = "https://github.com/EventoFramework/evento-framework/tree/main/evento-transport-netty"
                }
            }
            repositories {
                maven {
                    name = 'ossrh-staging-api'
                    url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
                    credentials {
                        username = project.findProperty("mavenCentralUsername") ?: System.getenv("MAVEN_CENTRAL_USERNAME")
                        password = project.findProperty("mavenCentralPassword") ?: System.getenv("MAVEN_CENTRAL_PASSWORD")
                    }
                }
                maven {
                    name = 'GitHubPackages'
                    url = "https://maven.pkg.github.com/EventoFramework/evento-framework"
                    credentials {
                        username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                        password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                    }
                }
            }
        }
    }
}

signing {
    required = false
    def signingKey = System.getenv("SIGNING_KEY")
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, System.getenv("SIGNING_PASSWORD"))
    }
    sign publishing.publications.mavenJava
}

javadoc {
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption("html5", true)
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}
